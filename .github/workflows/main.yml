name: Validate Docs Folder

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist in /docs
        run: |
          echo "Checking /docs folder..."
          
          if [ ! -d "docs" ]; then 
            echo "/docs folder missing!"; 
            exit 1; 
          fi
          echo "/docs folder exists"
          
          if [ ! -f "docs/erd.png" ] && [ ! -f "docs/erd.pdf" ]; then 
            echo "ERD file missing (must be PNG or PDF)"; 
            exit 1; 
          fi
          echo "ERD file found"
          
          if [ ! -f "docs/endpoint-plan.md" ] && [ ! -f "docs/endpoint-plan.pdf" ]; then 
            echo "Endpoint plan missing (must be MD or PDF)"; 
            exit 1; 
          fi
          echo "Endpoint plan found"
          
          if [ ! -f "docs/RaceDay_CreateAndSeed.sql" ]; then 
            echo "SQL script missing!"; 
            exit 1; 
          fi
          echo "SQL script found"
          
          echo "All required documents are present!"
