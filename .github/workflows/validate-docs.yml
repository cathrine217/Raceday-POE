name: Validate Docs & SQL

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

jobs:
  validate-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown files exist
        run: |
          if [ -z "$(find . -name '*.md' -not -path './node_modules/*')" ]; then
            echo "No markdown files found"
          else
            echo "Markdown files present"
          fi
      # You can add strict linting later

  validate-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SQL file exists
        run: test -f RaceDay/SQLQuery1.sql || exit 1

  check-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ERD PDF exists
        run: test -f docs/ERD\ PROG.pdf || exit 1

  check-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure placeholder.txt is removed
        run: |
          if [ -f docs/placeholder.txt ]; then
            echo "❌ placeholder.txt still present – delete it."
            exit 1
          else
            echo "✅ placeholder.txt removed."
          fi
