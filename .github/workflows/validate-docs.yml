name: Validate Docs & SQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: avto-dev/markdown-lint@v1
        with:
          args: '**/*.md'
          config: '.markdownlint.json'   # optional, can be added later

  validate-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlfluff
        run: pip install sqlfluff

      - name: Lint SQL scripts
        run: sqlfluff lint RaceDay/SQLQuery1.sql --dialect tsql

  check-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ERD PDF exists
        run: test -f docs/ERD\ PROG.pdf || exit 1

  check-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure placeholder.txt is removed
        run: |
          if [ -f docs/placeholder.txt ]; then
            echo "placeholder.txt still present – remove it."
            exit 1
          fi
