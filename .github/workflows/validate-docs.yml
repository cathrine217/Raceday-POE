name: Validate Docs Folder

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check docs folder
        run: |
          echo "Checking docs folder..."

          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder is missing"
            exit 1
          fi

          echo "docs folder exists"

      - name: Check ERD file
        run: |
          if [ -f "docs/erd.png" ] || [ -f "docs/erd.pdf" ]; then
            echo "ERD file found"
          else
            echo "ERROR: ERD file is missing"
            echo "Expected docs/erd.png or docs/erd.pdf"
            exit 1
          fi

      - name: Check endpoint plan
        run: |
          if [ -f "docs/endpoint-plan.md" ] || [ -f "docs/endpoint-plan.pdf" ]; then
            echo "Endpoint plan found"
          else
            echo "ERROR: Endpoint plan is missing"
            echo "Expected docs/endpoint-plan.md or docs/endpoint-plan.pdf"
            exit 1
          fi
